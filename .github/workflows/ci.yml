name: CI Pipeline (Python & Docker)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Run Tests (CI)
      run: python module.py

    - name: Build Docker Image (CD)
      run: docker build -t priority-api:latest .
